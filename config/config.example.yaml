# Nacos 引导（只连配置中心；业务密钥放 DataId，勿把 dsn/jwt/私钥写进本文件的生产副本）
# 详情见 docs/nacos-config.md
nacos:
  enabled: false
  # 单机一个地址；集群逗号分隔，客户端自动兼容
  server_addr: "10.100.113.151:8848"
  # namespace = 平台部署用的 Nacos「命名空间 ID」（不是显示名，也不是环境管理里的 code）：
  #   public（默认）→ "" 或 public
  #   autosql       → e4dec2e2-4711-432f-9110-cc9b67d66b81
  # 勿填 beijing / test；见 docs/nacos-config.md「业务环境 vs Nacos Namespace」
  namespace: "e4dec2e2-4711-432f-9110-cc9b67d66b81" # autosql；生产勿用 public
  group: DEFAULT_GROUP
  data_id: auto-dba.yaml
  username: nacos
  password: "" # 建议用环境变量 NACOS_PASSWORD
  # watch: true                      # 默认开启 ListenConfig 热更
  # restart_on_listen_change: false  # true：http.port 变更时自重启

app:
  name: auto-dba
  run_mode: debug
  # enabled=true 时由 Nacos 覆盖；本地开发可填
  jwt_secret: change-me-in-production
  jwt_ttl_hours: 24

http:
  host: "0.0.0.0"
  port: 8800
  read_timeout: 30
  write_timeout: 120
  pid_file: /tmp/auto-dba.pid
  # 前后端分离：默认不托管 frontend/dist。页面只走 Vite（见 frontend.dev_port）。
  serve_static: false

# 可同步进 Nacos DataId；Vite 启动时自动读取
frontend:
  dev_host: "127.0.0.1"
  dev_port: 5174

log:
  level: debug

db:
  driver: postgres
  # 本地填写或放 Nacos DataId；勿提交真实账号密码
  dsn: "postgres://user:password@127.0.0.1:5432/db_autosql?sslmode=disable"
  # 元库连接池（防耗尽 PostgreSQL max_connections）
  max_open_conns: 50
  max_idle_conns: 10
  conn_max_lifetime_sec: 1800
  conn_max_idle_time_sec: 300

cdc:
  enabled: false
  debezium_url: ""
  kafka_brokers: ""

migration:
  enabled: false
  oss_endpoint: ""

flashback:
  workdir: /tmp/auto-dba-flashback
  archive_dir: ""
  max_wal_bytes: 1073741824
  tencent_secret_id: ""
  tencent_secret_key: ""
  tencent_region: ""

backup:
  workdir: /tmp/auto-dba-backup
  # 开发/小规模可 true；生产建议 false + 登记/下发 Backup Agent
  allow_embedded: true
  # 平台侧 linux 制品（先执行 deploy/backup-agent/build.sh）
  agent_artifact: deploy/backup-agent/bin/platform-agent
  # SSH 用户须可写；勿用无权限的 /opt（除非已 chown）
  agent_remote_dir: /home/sysadmin/auto-dba/platform-agent
  agent_listen_port: 8090

external:
  dolphinscheduler_url: ""
  starrocks_fe_url: ""

# WebTTY / 实例主机 SSH（密钥登录，不用库账号密码）
# 私钥放在本机 config/terminal/，该目录不入库
terminal:
  enabled: true
  ssh_user: ""
  # 本地开发用路径；生产在 Nacos 配 ssh_private_key（PEM），启动后写成 config/terminal/.runtime_id_ed25519
  ssh_identity_file: config/terminal/id_ed25519
  # ssh_private_key: |
  #   -----BEGIN OPENSSH PRIVATE KEY-----
  #   ...
  #   -----END OPENSSH PRIVATE KEY-----
  # Agent SSH 下发的主机密钥校验：
  #   accept-new（默认）首次连接自动记录指纹，之后指纹变化才拒绝（同 OpenSSH StrictHostKeyChecking=accept-new）
  #   strict 必须预先登记指纹；insecure 不校验（仅开发）
  ssh_host_key_policy: accept-new
  # 平台自管 known_hosts，空则 config/terminal/known_hosts（不读 ~/.ssh/known_hosts）
  ssh_known_hosts_file: ""
  # 兼容旧配置：true 等同 ssh_host_key_policy: insecure，生产保持 false
  ssh_insecure_host_key: false
  scripts_dir: ""
  static_dir: ""
  max_lifetime_sec: 1800

# 可拆分微服务（K8s Pod 互通）
# mode: embed|remote|off；remote 时填 url
services:
  db_monitor:
    mode: embed
    url: ""
    host: "0.0.0.0"
    port: 8801
