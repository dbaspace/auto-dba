# Nacos 引导（只连配置中心；业务密钥放 DataId，勿把 dsn/jwt/私钥写进本文件的生产副本）
# 详情见 docs/nacos-config.md
nacos:
  enabled: false
  # 单机一个地址；集群逗号分隔，客户端自动兼容
  server_addr: "10.100.113.151:8848"
  # 默认不写 namespace（= public）。DataId 若在其它空间，再加一行或设 NACOS_NAMESPACE：
  #   namespace: "e4dec2e2-4711-432f-9110-cc9b67d66b81"  # autosql；须与 DataId 所在空间一致
  # 勿填 beijing / test；见 docs/nacos-config.md「业务环境 vs Nacos Namespace」
  group: DEFAULT_GROUP
  data_id: auto-dba.yaml
  username: nacos
  password: "" # 建议用环境变量 NACOS_PASSWORD
  # watch: true                      # 默认开启 ListenConfig 热更
  # restart_on_listen_change: false  # true：http.port 变更时自重启

app:
  name: auto-dba
  run_mode: debug
  # enabled=true 时由 Nacos 覆盖；本地开发可填
  jwt_secret: change-me-in-production   # 仅签 JWT；可轮换。勿单独靠它长期加密实例密码
  jwt_ttl_hours: 24
  # 字段加密（实例密码等）主密钥：生产务必单独固定配置，且勿随 jwt_secret 一起改。
  # 空则回退 jwt_secret——改 JWT / Nacos 热更后会出现「解密已存密码失败」。
  # crypto_secret: "另一段至少32位随机串"
  # 轮换窗口：先填旧主密钥（旧 crypto 或曾回退时的旧 jwt），再改 crypto_secret / jwt
  # crypto_secret_previous: ""
  # crypto_key_id: k1            # 写入 enc:v2:<kid>:…

http:
  host: "0.0.0.0"
  port: 8800
  read_timeout: 30
  write_timeout: 120
  pid_file: /tmp/auto-dba.pid
  # 前后端分离：默认不托管 frontend/dist。页面只走 Vite（见 frontend.dev_port）。
  serve_static: false

# 可同步进 Nacos DataId；Vite 启动时自动读取
frontend:
  dev_host: "127.0.0.1"
  dev_port: 5174

log:
  level: debug

db:
  driver: postgres
  # 本地填写或放 Nacos DataId；勿提交真实账号密码
  dsn: "postgres://user:password@127.0.0.1:5432/db_autosql?sslmode=disable"
  # 元库连接池（防耗尽 PostgreSQL max_connections）
  max_open_conns: 50
  max_idle_conns: 10
  conn_max_lifetime_sec: 1800
  conn_max_idle_time_sec: 300

# 平台登录会话（生产放 Nacos；默认关闭，不影响现网 JWT 行为）
redis:
  enabled: false
  addr: "127.0.0.1:6379"
  password: ""
  db: 0
  key_prefix: "autodba:"
  # session_ttl_hours: 24   # 空则回退 app.jwt_ttl_hours
  # sliding_expire 已忽略：有效会话在鉴权时把过期时间续到当前时间 + TTL，到期后不再续期
  sliding_expire: false
  fail_mode: closed         # closed=鉴权要求 Redis 会话；open=仅验 JWT
  max_sessions_per_user: 1  # 同一账号只保留最新登录；新登录踢掉该账号其它会话
  reconcile_interval_min: 5

cdc:
  enabled: false
  debezium_url: ""
  kafka_brokers: ""

migration:
  enabled: false
  oss_endpoint: ""

flashback:
  workdir: /tmp/auto-dba-flashback
  archive_dir: ""
  max_wal_bytes: 1073741824
  tencent_secret_id: ""
  tencent_secret_key: ""
  tencent_region: ""

backup:
  workdir: /tmp/auto-dba-backup
  # 开发/小规模可 true；生产建议 false + 登记/下发 Backup Agent
  allow_embedded: true
  # 平台侧 linux 制品（先执行 deploy/backup-agent/build.sh）
  agent_artifact: deploy/backup-agent/bin/platform-agent
  # SSH 用户须可写；勿用无权限的 /opt（除非已 chown）
  agent_remote_dir: /home/sysadmin/auto-dba/platform-agent
  agent_listen_port: 8090

external:
  dolphinscheduler_url: ""
  starrocks_fe_url: ""

# WebTTY / 实例主机 SSH（密钥登录，不用库账号密码）
# 私钥放在本机 config/terminal/，该目录不入库
terminal:
  enabled: true
  ssh_user: ""
  # 本地开发用路径；生产在 Nacos 配 ssh_private_key（PEM），启动后写成 config/terminal/.runtime_id_ed25519
  ssh_identity_file: config/terminal/id_ed25519
  # ssh_private_key: |
  #   -----BEGIN OPENSSH PRIVATE KEY-----
  #   ...
  #   -----END OPENSSH PRIVATE KEY-----
  # Agent SSH 下发的主机密钥校验：
  #   accept-new（默认）首次连接自动记录指纹，之后指纹变化才拒绝（同 OpenSSH StrictHostKeyChecking=accept-new）
  #   strict 必须预先登记指纹；insecure 不校验（仅开发）
  ssh_host_key_policy: accept-new
  # 平台自管 known_hosts，空则 config/terminal/known_hosts（不读 ~/.ssh/known_hosts）
  ssh_known_hosts_file: ""
  # 兼容旧配置：true 等同 ssh_host_key_policy: insecure，生产保持 false
  ssh_insecure_host_key: false
  scripts_dir: ""
  static_dir: ""
  max_lifetime_sec: 1800

# DBA Copilot（密钥放 Nacos；勿把真实 api_key 提交仓库；不读库表全局参数）
# Cursor 与 OpenAI 兼容网关勿混用同一段 base_url；通义/qwen 须 provider: openai
# copilot:
#   base_url: "https://api.cursor.com"
#   api_key: "crsr_…"   # 401 Invalid User API Key 时到 Dashboard 重新生成
#   model: "auto"
#   provider: "cursor"
#   # 通义示例：base_url 改为兼容网关 /v1，api_key=sk-…，provider: openai
#   # model: '[{"value":"qwen-plus","label":"通义"}]'

# 工单申请页环境档。只影响申请页下拉和数据源过滤，不改实例登记的环境编码。
# 省略整段时：编码含 test/dev 或等于 uat 归测试，其余归生产。
# ticket:
#   env_groups:
#     - code: prod
#       label: 生产
#       codes: [beijing, pobeice, ai-beijing, ai-sea, frankfurt, siliconvalley, singapore]
#     - code: test
#       label: 测试
#       codes: [test, dev, uat]

# 可拆分微服务（K8s Pod 互通）
# mode: embed|remote|off；remote 时填 url
services:
  db_monitor:
    mode: embed
    url: ""
    host: "0.0.0.0"
    port: 8801
